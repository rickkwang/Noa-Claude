name: Setup Noa toolchain
description: Bun, optional prebuilt ripgrep, and frozen dependency installs. Run after checkout.
inputs:
  ripgrep:
    description: Install the prebuilt ripgrep binary (the tools and their tests need system rg; tmux ships with the runner image).
    default: 'true'
  gui:
    description: Also install gui/ dependencies.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.9

    # A pinned release tarball instead of apt: no package-index refresh, no mirror retries.
    - name: Install ripgrep
      if: inputs.ripgrep == 'true'
      shell: bash
      run: |
        version=14.1.1
        name="ripgrep-$version-x86_64-unknown-linux-musl"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/rg.tgz" "https://github.com/BurntSushi/ripgrep/releases/download/$version/$name.tar.gz"
        echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  $RUNNER_TEMP/rg.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/rg.tgz" -C "$RUNNER_TEMP" "$name/rg"
        mkdir -p "$RUNNER_TEMP/bin" && mv "$RUNNER_TEMP/$name/rg" "$RUNNER_TEMP/bin/rg"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install GUI dependencies
      if: inputs.gui == 'true'
      shell: bash
      run: bun install --cwd gui --frozen-lockfile
