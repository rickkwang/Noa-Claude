name: Setup Noa toolchain
description: Bun, optional prebuilt ripgrep, and frozen dependency installs. Run after checkout.
inputs:
  ripgrep:
    description: Install the prebuilt ripgrep binary (the tools and their tests need system rg; tmux ships with the runner image).
    default: 'true'
  gui:
    description: Also install gui/ dependencies.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.9

    # A pinned release tarball instead of apt: no package-index refresh, no mirror retries.
    - name: Install ripgrep
      if: inputs.ripgrep == 'true'
      shell: bash
      run: |
        version=14.1.1
        name="ripgrep-$version-x86_64-unknown-linux-musl"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/rg.tgz" "https://github.com/BurntSushi/ripgrep/releases/download/$version/$name.tar.gz"
        echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  $RUNNER_TEMP/rg.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/rg.tgz" -C "$RUNNER_TEMP" "$name/rg"
        mkdir -p "$RUNNER_TEMP/bin" && mv "$RUNNER_TEMP/$name/rg" "$RUNNER_TEMP/bin/rg"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    # Bun's package cache (~50MB), so installs don't hinge on registry latency.
    # Only master pushes save it; PRs restore it read-only instead of each
    # storing a copy against the 10GB repository quota. The gui job never saves,
    # so its ~700MB of gui/ packages stay out of the shared entry.
    - name: Cache Bun packages
      if: github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.gui != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-packages-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    - name: Restore Bun packages
      if: github.event_name != 'push' || github.ref != 'refs/heads/master' || inputs.gui == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-packages-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install GUI dependencies
      if: inputs.gui == 'true'
      shell: bash
      run: bun install --cwd gui --frozen-lockfile
