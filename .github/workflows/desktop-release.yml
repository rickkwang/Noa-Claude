name: desktop-release

# Builds the unsigned macOS (arm64) Noa Agent app for a gui-v* tag and uploads the dmg and zip as
# workflow artifacts. The job is read-only (scripts/check-workflow-security.mjs forbids write
# permissions), so the GitHub Release is created separately from those artifacts. The in-app update
# check (gui/electron/updateCheck.cjs) reads gui-v* releases; keep the tag format and the
# Noa-Agent-<version>-arm64.dmg asset name.
on:
  push:
    tags:
      - 'gui-v*'
  # Manual build for checking a commit without a tag; it uploads artifacts only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macos-14 is not offered to this repository; macos-15 is the arm64 image in use.
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches the desktop version
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          VERSION=$(node -p "require('./gui/package.json').version")
          if [ "$REF_TYPE" = "tag" ] && [ "$TAG" != "gui-v$VERSION" ]; then
            echo "Tag $TAG does not match gui/package.json version $VERSION." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ripgrep is linux-only in the shared setup action, so it stays off on macOS.
      - uses: ./.github/actions/setup
        with:
          ripgrep: 'false'
          gui: 'true'

      - name: Build CLI bundle
        run: bun run build

      - name: GUI checks
        run: |
          bun run --cwd gui typecheck
          bun run --cwd gui test

      # No Developer ID certificate: electron-builder falls back to an ad-hoc signature.
      # Keychain discovery is off so the runner never looks for an identity.
      - name: Package dmg and zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          export BUN_PATH="$(command -v bun)"
          bun run --cwd gui desktop:release

      - name: Diagnose codesign failure
        if: failure()
        run: |
          APP="gui/release/mac-arm64/Noa Agent.app"
          ls -la "$APP/Contents/Frameworks/Electron Framework.framework/Versions" || true
          find "$APP/Contents/Frameworks/Electron Framework.framework" -type l -exec ls -l {} \; || true
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -5 || true

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noa-agent-${{ env.VERSION }}-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            gui/release/Noa-Agent-${{ env.VERSION }}-arm64.dmg
            gui/release/Noa-Agent-${{ env.VERSION }}-arm64.zip
