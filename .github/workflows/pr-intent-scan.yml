name: PR Intent Scan

# Runs on docs-only PRs too: suspicious links are as likely in Markdown as in code.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # One scan produces both the gate and the report.
      - name: Run suspicious intent scan
        run: |
          set -o pipefail
          node ./scripts/pr-intent-scan.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --fail-on high \
            --json | tee pr-intent-scan.json

      - name: Attach report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-intent-scan
          path: pr-intent-scan.json
