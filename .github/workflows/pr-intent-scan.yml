name: PR Intent Scan

# Runs on docs-only PRs too: suspicious links are as likely in Markdown as in code.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # One scan produces both the gate and the report.
      - name: Run suspicious intent scan
        run: |
          set -o pipefail
          node ./scripts/pr-intent-scan.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --fail-on high \
            --json | tee pr-intent-scan.json

      - name: Attach report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-intent-scan
          path: pr-intent-scan.json
