name: Engineering Live Smoke

on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLAUDE_AGENT_SMOKE_LIVE_TIMEOUT_MS: '30000'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install runtime tools
        run: |
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y ripgrep; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying"
            sleep 5
          done
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run engineering live smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN is required for live smoke."
            exit 1
          fi
          bun run smoke:engine:live
