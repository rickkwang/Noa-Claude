name: Engineering Live Smoke

on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      CLAUDE_AGENT_SMOKE_LIVE_TIMEOUT_MS: '30000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install runtime tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate live smoke secrets
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN is required for live smoke."
            exit 1
          fi

      - name: Run engineering live smoke
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: bun run smoke:engine:live
