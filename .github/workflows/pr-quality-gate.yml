name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install runtime tools
        run: |
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y ripgrep tmux; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying"
            sleep 5
          done
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install GUI dependencies
        run: bun install --cwd gui --frozen-lockfile

      - name: Workflow security checks
        run: bun ./scripts/check-workflow-security.mjs

      - name: Quality checks
        run: bun run check:quality

      - name: GUI quality checks
        run: |
          bun run --cwd gui typecheck
          bun run --cwd gui test
          bun run --cwd gui build

      - name: GUI workspace E2E
        run: |
          node scripts/e2e-gui-workspace.mjs
          bun run --cwd gui scripts/e2e-workspace.ts

      - name: "@ts-nocheck ratchet (debt may only shrink)"
        run: bun run check:nocheck

      - name: Runtime health
        run: bun run check:runtime

      - name: Critical path tests
        run: bun run test

      - name: Compiled agent loop E2E
        run: |
          bun run compile
          bun run e2e:loop
          bun run e2e:bare
          bun run e2e:tool-boundaries
          bun run e2e:restricted-safe
          bun run e2e:multiedit
          bun run e2e:deferred
          bun run e2e:goal
          bun run e2e:state
          bun run e2e:startup
          bun run e2e:background
          bun run --cwd gui test:bridge

      # Install / update / uninstall lifecycle of the curl-installed copy. Needs
      # network for bun install and the pinned GitHub release.
      - name: Install lifecycle E2E
        run: bun run e2e:install

      - name: Upload install lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-install-lifecycle
          path: dist/e2e-install-lifecycle

      # build:dev:full only proves the bundle resolves; the placeholder modules
      # behind the experimental flags have crashed it at startup before.
      - name: Full-feature build agent loop E2E
        run: |
          bun run build:dev:full
          bun ./scripts/e2e-agent-loop.mjs --entry dist/main-dev.js
          bun ./scripts/e2e-agent-lifecycle.mjs --entry dist/main-dev.js
          bun ./scripts/e2e-agent-coordination.mjs --entry dist/main-dev.js
