name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - main
      - develop

# A newer push to the same PR supersedes the older run. Pushes to the release
# branches group by SHA, so every commit there runs to completion (a shared
# group would let GitHub drop queued commits even without cancel-in-progress).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only changes skip the heavy jobs here instead of through `paths-ignore`:
  # a workflow filtered out by paths never reports, so a required check would
  # stay pending forever. Skipped jobs report success; `ci-ok` aggregates them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Classify changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            files=''
          else
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename' || true)
          fi
          # Unknown or truncated (the compare API stops at 300 files): run everything.
          # docs/release-notes.md is bundled into the build, so it is code here.
          if [ -z "$files" ] || [ "$(wc -l <<< "$files")" -ge 300 ] ||
             grep -qvE '^((README|FEATURES|FEATURE_AVAILABILITY_MATRIX|CLAUDE)\.md|(src|gui|scripts)/(.+/)?CLAUDE\.md|docs/.+\.md)$' <<< "$files" ||
             grep -qx 'docs/release-notes.md' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi
          head -50 <<< "$files"

  # Cheap and doc-sensitive (check:docs reads README and docs/), so it runs on every change.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ripgrep: 'false'
      - name: Workflow security checks
        run: bun ./scripts/check-workflow-security.mjs
      - name: Quality checks
        run: bun run check:quality
      - name: "@ts-nocheck ratchet (debt may only shrink)"
        run: bun run check:nocheck

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Runtime health
        run: bun run check:runtime
      - name: Critical path tests
        run: bun run test

  gui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          gui: 'true'
      - name: GUI quality checks
        run: |
          bun run --cwd gui typecheck
          bun run --cwd gui test
          bun run --cwd gui build
      - name: GUI workspace E2E
        run: |
          node scripts/e2e-gui-workspace.mjs
          bun run --cwd gui scripts/e2e-workspace.ts
      # The bridge spawns agents through run-noa.js, which needs dist/main.js;
      # building it here keeps the launcher's auto-rebuild out of test timeouts.
      - name: GUI bridge E2E
        run: |
          bun run build
          bun run --cwd gui test:bridge

  # Each shard builds its own binary (~8s) rather than waiting on a build job and
  # an artifact round trip. The agent-loop suite is the longest, so it is split.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiled loop 1
            build: bun run compile
            run: |
              bun ./scripts/e2e-agent-loop.mjs --shard 1/2
              bun ./scripts/e2e-agent-lifecycle.mjs
              bun run e2e:bare
              bun run e2e:restricted-safe
              bun run e2e:multiedit
          - name: compiled loop 2
            build: bun run compile
            run: |
              bun ./scripts/e2e-agent-loop.mjs --shard 2/2
              bun ./scripts/e2e-agent-coordination.mjs
          - name: compiled tools and startup
            build: bun run compile
            run: |
              bun run e2e:tool-boundaries
              bun run e2e:startup
          - name: compiled harness and background
            build: bun run compile
            run: |
              bun run e2e:deferred
              bun run e2e:goal
              bun run e2e:state
              bun run e2e:background
          # build:dev:full only proves the bundle resolves; the placeholder modules
          # behind the experimental flags have crashed it at startup before.
          - name: full-feature loop 1
            build: bun run build:dev:full
            run: |
              bun ./scripts/e2e-agent-loop.mjs --entry dist/main-dev.js --shard 1/2
              bun ./scripts/e2e-agent-lifecycle.mjs --entry dist/main-dev.js
          - name: full-feature loop 2
            build: bun run build:dev:full
            run: |
              bun ./scripts/e2e-agent-loop.mjs --entry dist/main-dev.js --shard 2/2
              bun ./scripts/e2e-agent-coordination.mjs --entry dist/main-dev.js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build
        run: ${{ matrix.build }}
      - name: E2E
        run: ${{ matrix.run }}

  # Install / update / uninstall lifecycle of the curl-installed copy. Needs
  # network for bun install and the pinned GitHub release.
  install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ripgrep: 'false'
      - name: Install lifecycle E2E
        run: bun run e2e:install
      - name: Upload install lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-install-lifecycle
          path: dist/e2e-install-lifecycle

  # The one check to mark as required: it reports for every run, including
  # docs-only ones where the jobs above were skipped.
  ci-ok:
    if: always()
    needs: [changes, static, unit, gui, e2e, install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac
