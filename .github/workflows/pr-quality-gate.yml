name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install runtime tools
        run: |
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y ripgrep; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying"
            sleep 5
          done
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality checks
        run: bun run check:quality

      - name: "@ts-nocheck ratchet (debt may only shrink)"
        run: bun run check:nocheck

      - name: Runtime health
        run: bun run check:runtime

      - name: Critical path tests
        run: bun run test

      - name: Compiled agent loop E2E
        run: |
          bun run compile
          bun run e2e:loop
          bun run e2e:bare
          bun run e2e:goal

      # build:dev:full only proves the bundle resolves; the placeholder modules
      # behind the experimental flags have crashed it at startup before.
      - name: Full-feature build agent loop E2E
        run: |
          bun run build:dev:full
          bun ./scripts/e2e-agent-loop.mjs --entry dist/main-dev.js
